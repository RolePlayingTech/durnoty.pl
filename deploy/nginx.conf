limit_req_zone $binary_remote_addr zone=durnoty_cms:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name durnoty.pl www.durnoty.pl;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/lib/durnoty-acme; }
    location / { return 301 https://durnoty.pl$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.durnoty.pl;
    ssl_certificate /etc/letsencrypt/live/durnoty.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/durnoty.pl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    return 301 https://durnoty.pl$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name durnoty.pl;
    ssl_certificate /etc/letsencrypt/live/durnoty.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/durnoty.pl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;
    access_log off;
    error_log /var/log/nginx/durnoty.error.log warn;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location /_astro/ {
        root /var/www/durnoty.pl/dist/client;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location /api/mumro/ {
        limit_req zone=durnoty_cms burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host durnoty.pl;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host durnoty.pl;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}
